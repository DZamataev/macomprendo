name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the audit's secret scan cannot silently change behaviour under us; bump
  # deliberately alongside the local `brew install gitleaks` version.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  tooling:
    name: Node tooling
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — `npm run audit` runs Gitleaks over the *whole history*, which a
      # shallow clone silently reduces to a single commit's worth of scanning.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run script tests
        run: npm run test:scripts

      - name: Check agent config symlinks
        run: node scripts/sync-agent-config.mjs --check

      - name: Check vendored Phosphor icons are current
        run: node scripts/sync-icons.mjs --check

      # Runner images do not ship Gitleaks, and audit-public-repo.mjs deliberately *fails*
      # rather than skipping its secret scan when the binary is missing.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Audit public repository files
        run: npm run audit

  macos:
    name: Swift tests and unsigned build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved', 'macos/Packages/WhisperBinary/Package.swift', 'macos/Packages/SherpaOnnxBinary/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Run Swift package tests
        run: swift test --package-path macos

      - name: Install XcodeGen
        run: brew install xcodegen

      # Pinned rather than inherited from the runner image, which preinstalls a different
      # major version than the tooling job uses.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate the Xcode project
        run: npm run gen

      # xcodegen floats via brew; if a new version changes output, regenerate and commit.
      - name: Committed project matches project.yml
        run: git diff --exit-code macos/Macomprendo.xcodeproj

      - name: Build the app without signing
        run: >-
          xcodebuild
          -project macos/Macomprendo.xcodeproj
          -scheme Macomprendo
          -configuration Release
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build an unsigned arm64 app bundle
        run: npm run build -- --arch arm64
