name: Feature request
description: Suggest something Macomprendo should do.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or situation, not the solution — what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. Optional if you only know the problem.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
